<!DOCTYPE html>
<html>
  <head>
    <title>
      Rock Paper Scissors
    </title>
    <style>
      body{
        font-family: Arial;
      }
      button{
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p>Basic Rock Paper Scissors against Computer</p>

    

    <button onclick="
      playGame('Rock');
    ">Rock</button>

    <button onclick="
      playGame('Paper');
    ">Paper</button>

    <button onclick="
      playGame('Scissors');
    ">Scissors</button>



    <script>
      function playGame(playerMove){
        const AiMove= pickAiMove();

        result='';

        if (playerMove==='Scissors'){
          if (AiMove==='Rock') {
            result= 'You lose.';
          } else if (AiMove==='Paper') {
            result= 'You win.';
          } else if (AiMove==='Scissors') {
            result= 'It\'s a tie.';
          }
        }
        
        else if (playerMove==='Paper'){
          if (AiMove==='Rock') {
            result= 'You win.';
          } else if (AiMove==='Paper') {
            result= 'It\'s a tie.';
          } else if (AiMove==='Scissors') {
            result= 'You lose.';
          }
        } 
        
        else if (playerMove==='Rock'){
          if (AiMove==='Rock') {
            result= 'It\'s a tie.';
          } else if (AiMove==='Paper') {
            result= 'You lose.';
          } else if (AiMove==='Scissors') {
            result= 'You win.';
          }
        }
        
        alert(`You picked ${playerMove}. Computer picked ${AiMove}. Therefore ${result}`);
      }

      function pickAiMove(){
        const randomNumber= Math.random();
        let AiMove='';

        if (randomNumber >= 0 && randomNumber < 1/3) {
          AiMove='Rock';
        }
        else if (randomNumber >= 1/3 && randomNumber < 2/3) {
          AiMove='Paper';
        }
        else if (randomNumber >= 2/3 && randomNumber < 1) {
          AiMove='Scissors';
        }
        return AiMove;
      }
    </script>
  </body>
</html>
