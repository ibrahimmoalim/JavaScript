<!DOCTYPE html>
<html>
  <head>
    <title>
      Basic calculator
    </title>
    <link rel="stylesheet" href="calculator.css">
  </head>
  <body>
    <div class="grid-container">

      <span class="js-screen">
        <span class="js-formula"></span>
        <span class=js-result></span>
      </span>

      <button onclick="
        clearScreen(); 
      ">
        <strong>C</strong>
      </button>
      <button onclick="
        calculate(' ( ');  
      ">(</button>
      <button onclick="
        calculate(' ) ');  
      ">)</button>
      <button>mod</button>
      <button onclick="
        calc*='3.141592654';
      ">Pi</button>
      <button class="num" onclick="
        calculate('7')
      ">7</button>
      <button class="num" onclick="
        calculate('8') 
      ">8</button>
      <button class="num" onclick="
        calculate('9') 
      ">9</button>
      <button onclick="
        calculate(' / ') 
      ">&divide;</button>
      <button>&radic;</button>
      <button class="num" onclick="
        calculate('4')
      ">4</button>
      <button class="num" onclick="
        calculate('5')
      ">5</button>
      <button class="num" onclick="
        calculate('6') 
      ">6</button>
      <button onclick="
        calculate(' * ')
      ">x</button>
      <button onclick="
        calc*=calc;
      "><em>X<sup>2</sup></em></button>
      <button class="num" onclick="
        calculate('1') 
      ">1</button>
      <button class="num" onclick="
        calculate('2')
      ">2</button>
      <button class="num" onclick="
        calculate('3')
      ">3</button>
      <button onclick="
        calculate(' - ')
      ">-</button>
      <button class="equal-button" onclick="
        calc=eval(calc);
        result()
      ">=</button>
      <button class="num" onclick="
        calculate('0')
      ">0</button>
      <button onclick="
        calculate('.')
      ">.</button>
      <button onclick="
        calc/='100';
      ">%</button>
      <button onclick="
        calculate(' + ')
      ">+</button>
    </div>

    <script src="calculator.js"></script>
    
  </body>
</html>
