<!DOCTYPE html>
<html>
  <head>
    <title>
      Basic Coin flip
    </title>
    <style>
      button:hover{
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h3>Guess Heads or Tails to play</h3>
    <button onclick="
      playGame('Heads');
      ">
      Heads
    </button>
      
    <button onclick="
      playGame('Tails');
    ">
      Tails
    </button>

    <p class="js-result"></p>
    <p class="js-score"></p>

    <button onclick="
      score.wins= 0;
      score.losses= 0;
      localStorage.removeItem('score');
      refresh()
    ">
      Reset score
    </button>


    <script src="coin-flip.js"></script>
  </body>
</html>
