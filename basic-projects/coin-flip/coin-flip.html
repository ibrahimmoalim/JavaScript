<!DOCTYPE html>
<html>
  <head>
    <title>
      Basic Coin flip
    </title>
    <link rel="stylesheet" href="coin-flip.css">
  </head>
  <body>
    <div class="container" >
      <h1>Coin Flip</h1>
      <h2>Heads or Tails</h2>
      <h3><img src="callit.gif" alt="Call It"> </h3>
      <button onclick="
        playGame('Heads');
        ">
        Heads
      </button>
        
      <button onclick="
        playGame('Tails');
      ">
        Tails
      </button>

      <p class="js-result result"></p>
      <p class="js-score score"></p>

      <button onclick="
        score.wins= 0;
        score.losses= 0;
        localStorage.removeItem('score');
        refresh()
      ">
        Reset score
      </button>
    </div>
    
    <script src="coin-flip.js"></script>
  </body>
</html>
