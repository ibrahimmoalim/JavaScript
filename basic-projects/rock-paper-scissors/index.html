<!DOCTYPE html>
<html>
  <head>
    <title>
      Basic rock paper scissors
    </title>
    <link rel="stylesheet" href="rps.css">
  </head>
  <body>

    <p class="title">Basic Rock Paper Scissors against Computer</p>
    <h3 class="note">> you can play with keys: 'r' for rock, 'p' for paper, 's' for scissors, 'a' for autoplay and 'esc' for resetting score.</h3>
    <h3 class="note2">> autoplay doesn't save score.</h3>

    <button class="move-button js-rock"><img class="move-icon" src="icons/Rock-emoji.png"> </button>

    <button class="move-button js-paper"><img class="move-icon" src="icons/Paper-emoji.png"> </button>

    <button class="move-button js-scissors"><img class="move-icon" src="icons/Scissors-emoji.png"></button>

    <p class="js-player-result player-result"></p>
    <p class="js-result"></p>
    <p class="js-score score"></p>

    <button class="reset-score">
      Reset Score
    </button>

    <button class="js-autoplay">AutoPlay</button><br><br>

    <div class="js-confirmation">
      
    </div>
    



    <script src="rps.js"></script>
  </body>
</html>
