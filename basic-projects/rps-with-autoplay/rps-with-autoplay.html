<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel='stylesheet' href='rps-with-autoplay.css'>
  </head>
  <body>
    <h1>Rock Paper Scissors</h1>

    <button onclick="playGame('rock')" class="js-button"><img class="images" src="icons/rock-emoji.png"></button>
    <button onclick="playGame('paper')" class="js-button"><img class="images" src="icons/paper-emoji.png"></button>
    <button onclick="playGame('scissors')" class="js-button"><img class="images" src="icons/scissors-emoji.png"></button>

    <p class="js-picks"></p>

    <h2 class="js-result"></h2>

    <p class="js-score"></p>

    <button class="reset-score" onclick="
    resetScore()
    score.wins = 0
    score.losses = 0
    score.ties = 0
    updateScore()
    ">Reset Score</button>

    <br><br><br><br>

    <button onclick="
    setInterval(autoPlay(), 2000);
    updateComputerScore()
    " class="auto-play">Auto Play (clanker1 vs clanker2)</button>

    <p class="js-picks js-computer-picks"></p>

    <h2 class="js-result js-computer-result"></h2>

    <p class="js-score js-computer1-score"></p>
    <p class="js-score js-computer2-score"></p>

    <button class="reset-score" onclick="
    resetComputerScore()
    computer1score.wins = 0
    computer1score.losses = 0
    computer1score.ties = 0
    computer2score.wins = 0
    computer2score.losses = 0
    computer2score.ties = 0
    updateComputerScore()
    ">Reset Clanker Scores</button>

    <script src='rps-with-autoplay.js'></script>
  </body>
</html>
