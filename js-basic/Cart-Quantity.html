    <button onclick="
      updateCartQuant(0)
    ">
      Show Quantiy
    </button>

    <button onclick="
      updateCartQuant(5)

    <button onclick="
      updateCartQuant(-1)

    </button>

    <button onclick="

      -2

    <button onclick="
      updateCartQuant(-5)
    ">
      -5
    </button>

    <button onclick="
    cartQuant=0;
    console.log(`Cart has been reset`);
    console.log(`Cart quantity: ${cartQuant}`);
    ">
      Reset Cart
    </button>

    <script>
      let cartQuant=0;

      function updateCartQuant(value){
        if (cartQuant +value > 10){
        alert('Cart is full dummy.');
        return;
      }
        
        if (cartQuant +value < 0){
        alert('Not enough items to remove.');
        return;
      }

        cartQuant += value;
        console.log(`Cart quantity: ${cartQuant}`);
      }
    </script>
