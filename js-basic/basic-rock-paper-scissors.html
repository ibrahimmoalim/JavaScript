        AiMove='Rock';

      else if (randomNumber >= 1/3 && randomNumber < 2/3) {
        AiMove='Paper';
      }
      else if (randomNumber >= 2/3 && randomNumber < 1) {
        AiMove='Scissors';
      }
      console.log(AiMove);

      let result='';

      if (AiMove==='Rock') {
        result= 'Tie.';
      } else if (AiMove==='Paper') {
        result= 'You lose.';
      } else if (AiMove==='Scissors') {
        result= 'You win.';
      }
      
      alert(`You picked Rock. Computer picked ${AiMove}. Therefore ${result}`);

    ">Rock</button>
