<!DOCTYPE html>
<html>
  <head>
    <title>
      Calculator
    </title>
    <style>
      button{
        cursor: pointer;
        padding: 8px 16px;
        font-size: 16px;
        background-color: rgb(156, 156, 156);
        border: 0px solid grey;
        border-radius: 4px;
      }
      button:hover{
        opacity: 0.7;
      }
      button:active{
        opacity: 0.5;
      }
      .grid-container{
        display: grid;
        grid-template-columns: repeat(5, 60px);
        grid-template-rows: repeat(5, 40px);
        gap: 3px;
      }
      .equal-button{
        grid-row: 4 / span 2;
        grid-column: 5;
        background-color: rgb(255, 123, 0);
      }
      .num{
        background-color: lightgray;
        border: 0px solid grey;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <button onclick="
        calc='';
        console.log(`Cleared.`); 
      "><strong>C</strong></button>
      <button onclick="
        calc+=' ( ';
        console.log(`${calc}`);  
      ">(</button>
      <button onclick="
        calc+=' \) ';
        console.log(`${calc}`);  
      ">)</button>
      <button>mod</button>
      <button onclick="
        calc*='3.141592654';
        console.log(`${calc}`);  
      ">Pi</button>
      <button class="num" onclick="
        calc+=7;
        console.log(`${calc}`);  
      ">7</button>
      <button class="num" onclick="
        calc+=8;
        console.log(`${calc}`);  
      ">8</button>
      <button class="num" onclick="
        calc+=9;
        console.log(`${calc}`);  
      ">9</button>
      <button onclick="
        calc+=' / ';
        console.log(`${calc}`);  
      ">&divide;</button>
      <button>&radic;</button>
      <button class="num" onclick="
        calc+=4;
        console.log(`${calc}`);  
      ">4</button>
      <button class="num" onclick="
        calc+=5;
        console.log(`${calc}`);  
      ">5</button>
      <button class="num" onclick="
        calc+=6;
        console.log(`${calc}`);  
      ">6</button>
      <button onclick="
        calc+=' * ';
        console.log(`${calc}`);  
      ">x</button>
      <button onclick="
        calc*=calc;
        console.log(`${calc}`);  
      "><em>X<sup>2</sup></em></button>
      <button class="num" onclick="
        calc+=1;
        console.log(`${calc}`);  
      ">1</button>
      <button class="num" onclick="
        calc+=2;
        console.log(`${calc}`);  
      ">2</button>
      <button class="num" onclick="
        calc+=3;
        console.log(`${calc}`);  
      ">3</button>
      <button onclick="
        calc+=' - ';
        console.log(`${calc}`);  
      ">-</button>
      <button class="equal-button" onclick="
        calc=eval(calc);
        console.log(`${calc}`);  
      ">=</button>
      <button class="num" onclick="
        calc+=0;
        console.log(`${calc}`);  
      ">0</button>
      <button onclick="
        calc+='.';
        console.log(`${calc}`);  
      ">.</button>
      <button onclick="
        calc/='100';
        console.log(`${calc}`);  
      ">%</button>
      <button onclick="
        calc+=' + ';
        console.log(`${calc}`);  
      ">+</button>
    </div>
    

    <script>
      let calc='';
    </script>
  </body>
</html>
