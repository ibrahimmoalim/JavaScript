<!DOCTYPE html>
<html>
  <head>
    <title>
      DOM Projects
    </title>
  </head>
  <style>
    html{
      padding: 0;
      margin: 0;
    }
    body{
      padding: 0;
      margin: 0;
    }
    button {
      cursor: pointer;
    }
    .js-total {
      height: 5px;
    }
  </style>
  <body>
    <p>YouTube Subscribe Button</p>
    <button class="js-button" onclick="
      changeText()
    ">Subscribe</button>

    <br><br><br><br>

    <input class="js-input" placeholder="Calculate">
    <button onclick="calc()">Calculate</button>
    <p class="js-total"></p>


    <script>
      const buttonElement = document.querySelector('.js-button') 
      function changeText(){
        if (buttonElement.innerHTML === 'Subscribe'){
          buttonElement.innerHTML = 'Subscribed';
        } else {
            buttonElement.innerHTML = 'Subscribe';
        }
      }
      
      function calc(){
        let value= document.querySelector('.js-input').value;
        let cost= Number(value);
        if (isNaN(cost) || value===''){
          // ^^ checks whether "cost" is NaN (Not a Number), if true then code below is run.
          document.querySelector('.js-total')
         .innerHTML = `Enter a Number`
         return;
        }
        if (cost===0){
          document.querySelector('.js-total')
         .innerHTML = `$0`
        }
        else if (cost < 40){
          cost+=10;
        }
        document.querySelector('.js-total')
         .innerHTML = `$${cost}`
      } 
    </script>
  </body>
</html>
