<!DOCTYPE html>
<html>
  <head>
    <title>
      Cart Quantity
    </title>
    <style>
      button{
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <button onclick="
      updateCartQuant(0)
    ">
      Show Quantiy
    </button>

    <button onclick="
      updateCartQuant(1)
      
    ">
      Add to cart
    </button>

    <button onclick="
      updateCartQuant(2)
    ">
      +2
    </button>

    <button onclick="
      updateCartQuant(3)
    ">
      +3
    </button>

    <button onclick="
      updateCartQuant(5)
    ">
      +5
    </button>

    <button onclick="
      updateCartQuant(-1)
    ">
      Remove from cart
    </button>

    <button onclick="
      updateCartQuant(-2)
    ">
      -2
    </button>

    <button onclick="
      updateCartQuant(-5)
    ">
      -5
    </button>

    <p class="js-quant1"></p>
    <p class="js-quant"></p>

    <button onclick="
    resetMessage()
    localStorage.removeItem('cart');
    ">
      Reset Cart
    </button>



    <script>

      let cartQuant = JSON.parse(localStorage.getItem('cart')) || 0

      quantity()

      function updateCartQuant(value){
        document.querySelector('.js-quant1').innerHTML = ''

        if (cartQuant +value > 10){
        document.querySelector('.js-quant').innerHTML = `Cart is full.`
        return;
      }
        
        if (cartQuant +value < 0){
        document.querySelector('.js-quant').innerHTML = `Not enough items to remove.`
        return;
      }

        cartQuant += value;
        quantity()
        localStorage.setItem('cart', JSON.stringify(cartQuant));
      }

      function quantity(){
        document.querySelector('.js-quant').innerHTML = `Cart quantity: ${cartQuant}`
      }

      function resetMessage(){
        cartQuant=0;
        quantity()
        document.querySelector('.js-quant1').innerHTML = `Cart has been reset`
      }

      const var3=var2+2;
      console.log(var3-1);

      const var4='hello, lad';
      console.log(var4);*/
    </script>
  </body>
</html>
