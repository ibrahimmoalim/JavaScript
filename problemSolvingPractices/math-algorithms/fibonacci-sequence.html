<!DOCTYPE html>
<html>
  <head>
    <title>
      which number is the third highest
    </title>
  </head>
  <body>


    <script>

      function fibonacci(n){
        const fib=[0,1]

        for (let i=2; i<n; i++){
          fib[i]= fib [i-2]+ fib[i-1]
        }
        return fib
      }


      console.log(fibonacci(1))
      console.log(fibonacci(2))
      console.log(fibonacci(3))
      console.log(fibonacci(8))

    </script>
  </body>
</html>
