<!DOCTYPE html>
<html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Conversion Tool</title>
  <link rel='stylesheet' href='style.css'>
  <script src='script.js' defer></script>
</head>
<body>
  <h3> Convert an IPv4 address from Binary to Decimal </h3><br>
  <!-- <h3> Example: 10101100.00010000.00100010.00000011(Binary) to 172.16.34.3 </h3><br> -->

  <input type="text" placeholder="Example: 10101100.00010000.00100010.00000011" id="input1">
  <button id="but1">Convert</button>
  <br><br>
  <h4 id="result"></h4>

  <br><br><br><br>

  <h3> Convert an IPv4 address from Decimal to Binary </h3><br>
  <!-- <h3> Example: 10101100.00010000.00100010.00000011(Binary) to 172.16.34.3 </h3><br> -->

  <input type="text" placeholder="Example: 172.16.34.3" id="input2">
  <button id="but2">Convert</button>
  <br><br>
  <h4 id="result2"></h4>

</body>
</html>
